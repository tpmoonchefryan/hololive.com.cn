name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hololive-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      DEPLOY_REVISION: ${{ github.sha }}
      # External inventoried, approved root-owned config. No guessed host paths.
      DEPLOY_CONFIG: ${{ vars.DEPLOY_CONFIG }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale or unconfigured deployment
        run: |
          set -euo pipefail
          test -n "$DEPLOY_CONFIG"
          test -f "$DEPLOY_CONFIG"
          test "$(git rev-parse HEAD)" = "$DEPLOY_REVISION"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$DEPLOY_REVISION"
          node scripts/deployment-inputs.mjs host "$DEPLOY_CONFIG"
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      - name: Verify candidate
        env:
          MIGRATION_CHECK_BASE_SHA: ${{ github.event.before }}
          MIGRATION_CHECK_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run check:migrations
          npm run lint
          npm run audit:prod
          npm run build
          npm run check:bundle
          node scripts/deployment-inputs.mjs supply-tests "$DEPLOY_CONFIG"
        # Network audit failures stop the deployment. They cannot prove safety.

      - name: Prepare complete locked artifact
        run: |
          set -euo pipefail
          bundle="$(mktemp -d "$RUNNER_TEMP/hololive-release.XXXXXX")"
          git archive "$DEPLOY_REVISION" package.json package-lock.json backend/pb_migrations backend/pb_hooks backend/scripts | tar -x -C "$bundle"
          npm ci --prefix "$bundle" --omit=dev --ignore-scripts --registry=https://registry.npmjs.org
          cp -a dist "$bundle/"
          node scripts/deployment.mjs bundle "$bundle" "$DEPLOY_REVISION"
          printf 'DEPLOY_BUNDLE=%s\n' "$bundle" >> "$GITHUB_ENV"

      - name: Verify finite action plan
        run: node scripts/deployment.mjs plan "$DEPLOY_BUNDLE" "$DEPLOY_CONFIG" "$GITHUB_RUN_NUMBER"

      - name: Deploy approved revision
        run: ./deploy.sh apply "$DEPLOY_BUNDLE" "$DEPLOY_CONFIG" "$GITHUB_RUN_NUMBER"
        # Never invokes setup_*, package-manager host changes, nginx rewrites,
        # accounts, or Java Velocity. Private backup/contract evidence stays on host.
